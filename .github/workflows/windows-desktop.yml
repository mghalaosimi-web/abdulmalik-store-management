name: Windows desktop validation and installer

on:
  push:
    branches: [main, feature/offline-windows-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Typecheck, tests and Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.12.1

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Windows desktop application
        run: pnpm tauri build

      - name: Publish NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: abdulmalik-store-management-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
